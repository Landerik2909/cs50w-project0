<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <title>Advanced search</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link href="style.css" rel="stylesheet">
    </head>

    <body>
        <!--Navbar-->
        <div class="container-fluid ps-5">
            <div class="row">
                <div class="col ">
                    <nav>
                        <ul class="nav justify-content-md-end">
                            <li class="nav-item">
                                <a class="nav-link" href="index.html">Home</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>


            <!--Logo-->

            <div class="row align-items-start">
                <div class="col">
                    <img alt="" src="https://www.gstatic.com/images/branding/googlelogo/svg/googlelogo_clr_92x30px.svg">
                </div>
            </div>

            <!--Main-->
            <div class="row justify-content-md-start text-left pt-4">
                <div class="col-6">
                    <h1>Rozšířené vyhledávání</h1>
                    <h2>Kritéria vyhledávání stránek</h2>
                </div>
            </div>








            <form action="https://google.com/search" class="align-items-center">
                <div class="row justify-content-md-start pt-4">
                    <div class="col-1">
                        <label for="allWords" class="col-form-label">All these words:</label>
                    </div>
                    <div class="col-2">
                        <input id="allWords" class="form-control px-3 py-2" type="text" name="as_q">
                    </div>
                </div>
                <div class="row justify-content-md-start pt-4">
                    <div class="col-1">
                        <label for="exactWords" class="col-form-label">This exact word or phrase:</label>
                    </div>
                    <div class="col-2">
                        <input id="exactWords" class="form-control px-3 py-2" type="text" name="as_epq">
                    </div>
                </div>
                <div class="row justify-content-md-start pt-4">
                    <div class="col-1">
                        <label for="anyWords" class="col-form-label">Any of these words:</label>

                    </div>
                    <div class="col-2">
                        <input id="anyWords" class="form-control px-3 py-2" type="text" name="as_oq">
                    </div>
                </div>
                <div class="row justify-content-md-start pt-4">
                    <div class="col-1">
                        <label for="noneWords" class="col-form-label">None of these words:</label>
                    </div>
                    <div class="col-2">
                        <input id="noneWords" class="form-control px-3 py-2" type="text" name="as_eq">
                    </div>
                </div>
                <div class="row justify-content-md-start text-end pt-4">
                    <div class="col-3">
                        <input class="btn btn-light m-1" type="submit" value="Google Search">
                    </div>
                </div>
            </form>
        </div>
    </body>

</html>
