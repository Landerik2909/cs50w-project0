<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Search</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>

    <body>

        <div class="container-fluid">
            <div class="row">
                <div class="col ">
                    <nav>
                        <ul class="nav justify-content-md-end">
                            <li class="nav-item">
                                <a class="nav-link" href="image.html">Image Search</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="Advanced Search">Advanced Search</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>

        <div class="container">
            <form action="https://google.com/search">
                <div class="row text-center">
                    <div class="col">
                        <input class="form-control" type="text" name="q">
                    </div>
                </div>
                <div class="row text-center">
                    <div class="col">
                        <input class="btn btn-light" type="submit" value="Google Search">
                    </div>
                    <div class="col">
                        <input class="btn btn-light" type="submit" value="I'm Feel Lucky" name="btnI">

                    </div>
                </div>
            </form>
        </div>

    </body>

</html>
